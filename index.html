<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Bubble Total</title><link rel="stylesheet" href="style.css"><style>.admin-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #52607b}.admin-row-info{display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}.admin-row-buttons{display:flex;gap:8px}.admin-row-buttons button{width:auto;padding:10px 12px}.admin-row-buttons .danger{background:#bc4051}#adminList{margin:12px 0 24px;max-height:55vh;overflow:auto}#adminSearch{width:100%}</style></head><body><main id="app"><header><h1>🫧 Live Bubble Total</h1><span id="status">กำลังเชื่อมต่อ...</span></header><nav><a href="?view=screen">📺 จอแสดงผล</a><a href="?view=join">📱 ส่งยอด</a><a href="?view=admin">⚙️ ผู้จัด</a></nav><section id="screen" hidden><div class="stats"><div>ยอดรวมทั้งหมด<strong id="total">0</strong>บาท</div><div>จำนวนผู้ตอบ<strong id="count">0</strong>คน</div></div><div id="bubbleArea" aria-label="คำตอบเป็นฟองอากาศ"></div><div class="qr"><canvas id="qr"></canvas><p>สแกนเพื่อส่งยอด</p><p id="joinUrl"></p></div><button id="fullscreen">เต็มหน้าจอ</button></section><section id="join" hidden><div class="panel"><h2>ส่งยอดของคุณ</h2><p>ส่งได้ 1 ครั้งต่ออุปกรณ์/บัญชีที่ใช้ตอบ</p><form id="responseForm"><label>ชื่อที่แสดง<input id="name" maxlength="30" required placeholder="ชื่อของคุณ"></label><label>ยอดตัวเลข<input id="amount" type="number" min="0" max="1000000000" step="0.01" required placeholder="เช่น 5000"></label><button type="submit">ส่งคำตอบ</button></form><p id="joinMessage"></p></div></section><section id="admin" hidden><div class="panel"><h2>ผู้จัดงาน</h2><form id="loginForm"><label>อีเมลผู้จัด<input id="email" type="email" required></label><label>รหัสผ่าน<input id="password" type="password" required></label><button type="submit">เข้าสู่ระบบ</button></form><div id="adminActions" hidden><p>เข้าสู่ระบบแล้ว: <span id="adminEmail"></span></p><h3>จัดการยอดรายคน</h3><p id="adminSummary"></p><label>ค้นหาชื่อสมาชิก<input id="adminSearch" type="search" placeholder="พิมพ์ชื่อเพื่อค้นหา"></label><div id="adminList" aria-live="polite"></div><hr><button id="reset" class="danger">ล้างคำตอบทั้งหมด (เริ่มรอบใหม่)</button><button id="logout">ออกจากระบบ</button></div><p id="adminMessage"></p></div></section></main><script type="module" src="app.js"></script></body></html>
